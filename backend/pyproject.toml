[project]
name = "grouptrip-backend"
version = "0.1.0"
description = "GroupTrip API: explainable group destination recommendations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.2.4",
    "openai>=3.48.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "uvicorn app.main:app --reload --port 8000"
start = "uvicorn app.main:app --host 127.0.0.1 --port 8000"
test = "pytest -q"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
